[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

# One replica, and one uvicorn worker inside it (see the CMD in Dockerfile).
# The concurrent-render limit is in-process state in app/render_slots.py, so a
# second worker or replica would hand out the same slots twice and turn a burst
# that fits inside every other limit into an out-of-memory kill. Moving that
# state to Postgres is the prerequisite for scaling out — see the deploy
# checklist in docs/accounts-and-payments.md and "Not in this spec" in
# docs/deploy.md. One replica is Railway's default, so there is nothing to
# configure here.
[deploy]
# A failed migration stops the deploy; the previous image keeps serving.
preDeployCommand = ["alembic upgrade head"]
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
